services:
  # ── Backend Laravel (PHP 8.2) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spacelink_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - SCOUT_DRIVER=database
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME="SpaceLink"
      - VNPAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_RETURN_URL=http://localhost:5173/payment-return
      - VNPAY_ORDER_EXPIRE_MINUTES=3
      - GHN_TOKEN=${GHN_TOKEN}
      - GHN_SHOP_ID=${GHN_SHOP_ID}
    networks:
      - spacelink-network

  # ── Queue Worker ─────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spacelink_queue
    working_dir: /var/www/html
    command: sh -c "php artisan config:clear && php artisan queue:work --verbose --tries=3 --timeout=90"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=database
    networks:
      - spacelink-network

  # ── Scheduler ────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spacelink_scheduler
    working_dir: /var/www/html
    command: sh -c "php artisan schedule:work"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - spacelink-network

  # ── Frontend React + Vite + TypeScript ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: spacelink_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - spacelink-network

  # ── MySQL 8.0 ────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: spacelink_db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - spacelink_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spacelink-network

  # ── phpMyAdmin ───────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: spacelink_phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - PMA_USER=${DB_USERNAME}
      - PMA_PASSWORD=${DB_PASSWORD}
      - UPLOAD_LIMIT=300M
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spacelink-network

  # ── Migrate + Seed + Setup (chạy thủ công) ──────────────────
  # Lệnh: docker compose run --rm migrate
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "
      php artisan migrate --force &&
      php artisan db:seed --force &&
      rm -f public/storage &&
      php artisan storage:link &&
      chmod -R 755 storage/app/public
      "
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - spacelink-network

volumes:
  spacelink_db_data:

networks:
  spacelink-network:
    driver: bridge
